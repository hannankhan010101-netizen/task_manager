<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Introduction Video</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #15120d;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      .wrap {
        width: 100%;
        max-width: 720px;
      }
      h1 {
        color: #f3ebdb;
        font-size: 1.1rem;
        font-weight: 500;
        margin: 0 0 1rem;
        text-align: center;
      }
      video {
        width: 100%;
        border-radius: 14px;
        display: block;
        box-shadow: 0 18px 36px -18px rgba(0, 0, 0, 0.6);
        background: #000;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Introduction Video</h1>
      <video
        controls
        preload="metadata"
        src="https://github.com/hannankhan010101-netizen/task_manager/releases/download/intro-video/My.video.-.Date.mp4"
      >
        Your browser does not support the video tag.
      </video>
    </div>
  </body>
</html>
